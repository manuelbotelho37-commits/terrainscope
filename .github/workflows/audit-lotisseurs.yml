name: TerrainScope · audit foncier horaire

on:
  push:
    paths:
      - 'scripts/sync_lotisseurs.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terrainscope-lotisseurs-audit
  cancel-in-progress: false

jobs:
  audit-officiel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Télécharger TerrainScope
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les outils de lecture
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium
      - name: Tester les règles anti-faux-zéro
        run: python scripts/sync_lotisseurs.py --test
      - name: Comparer les catalogues officiels
        run: python scripts/sync_lotisseurs.py
      - name: Enregistrer uniquement les résultats constatés
        run: |
          if ! git diff --quiet -- lotisseurs-live.json || [ -n "$(git ls-files --others --exclude-standard lotisseurs-live.json)" ]; then
            git config user.name 'terrainscope-audit[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lotisseurs-live.json
            git commit -m "chore: audit horaire des catalogues officiels [skip ci]"
            # Les mises à jour du site et l'audit peuvent être simultanés.
            # Intégrer les changements distants sans force-push, puis retenter.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Audit enregistré (tentative $attempt)"
                exit 0
              fi
              echo "Conflit de mise à jour : tentative $attempt/5"
              sleep 4
            done
            echo "Échec d'enregistrement : aucun changement forcé."
            exit 1
          else
            echo 'Aucun changement de rapport'
          fi
