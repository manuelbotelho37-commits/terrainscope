name: TerrainScope · communes officielles 37

on:
  push:
    paths:
      - 'scripts/sync_communes37.py'
  workflow_dispatch:
  schedule:
    - cron: '42 4 1 * *'

permissions:
  contents: write

concurrency:
  group: terrainscope-communes37
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Télécharger et valider les communes officielles
        run: python scripts/sync_communes37.py
      - name: Enregistrer le répertoire local
        run: |
          git config user.name "terrainscope-communes[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add communes-37.json
          if ! git diff --cached --quiet; then
            git commit -m "data: mettre à jour l'annuaire officiel des communes du 37 [skip ci]"
            git push
          else
            echo "La liste officielle n'a pas changé"
          fi
