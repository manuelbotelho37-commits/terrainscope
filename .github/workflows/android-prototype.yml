name: Tester et construire TerraNova Android

on:
  push:
    branches: [android-capture-prototype]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-prototype.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Lire le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tester l'extraction HTML et JSON-LD
        run: node android-app/tests/ExtractorSmokeTest.cjs

      - name: Tester le tri et les doublons sans Android
        run: |
          mkdir -p android-app/build/engine-smoke
          javac -encoding UTF-8 -d android-app/build/engine-smoke \
            android-app/app/src/main/java/fr/terrainscope/app/ListingEngine.java \
            android-app/app/src/main/java/fr/terrainscope/app/SearchUrls.java \
            android-app/tests/ListingEngineSmokeTest.java \
            android-app/tests/SearchUrlsSmokeTest.java
          java -cp android-app/build/engine-smoke fr.terrainscope.app.ListingEngineSmokeTest
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('android-app/app/src/main/assets/communes-37.json','utf8'));fs.writeFileSync('android-app/build/communes-37-test.tsv',a.map(x=>[x.nom,x.codesPostaux[0]].join(String.fromCharCode(9))).join(String.fromCharCode(10)));console.log('Communes testées :',a.length)"
          java -cp android-app/build/engine-smoke fr.terrainscope.app.SearchUrlsSmokeTest android-app/build/communes-37-test.tsv

      - name: Installer Android API 35
        run: |
          # Ubuntu GitHub dispose déjà du SDK Android. L'ancien setup-android
          # tente d'installer le paquet obsolète "tools", qui fait échouer le job.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Construire l'application expérimentale
        run: gradle -p android-app :app:assembleDebug --no-daemon

      - name: Vérifier le démarrage sur un émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n fr.terrainscope.app/.MainActivity
            sleep 8
            # uiautomator dump lance un second processus Android : l'émulateur
            # du runner s'est fait tuer (code 137 / mémoire). Test plus léger.
            adb shell pidof fr.terrainscope.app | grep -Eq '[0-9]'
            mkdir -p android-app/build/visual-test
            timeout 35 adb exec-out screencap -p > android-app/build/visual-test/accueil.png || true
            test -s android-app/build/visual-test/accueil.png
            adb shell pidof fr.terrainscope.app | grep -Eq '[0-9]'

      - name: Conserver la capture de l'interface Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TerraNova-Android-Visual-Test
          path: android-app/build/visual-test/
          retention-days: 7
          if-no-files-found: warn

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: TerraNova-Android-Prototype-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
