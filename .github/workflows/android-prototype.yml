name: Tester et construire TerraNova Android

# Les mises à jour compilent automatiquement quand le code Android change.
# L'ancien site web TerrainScope (branche main) n'est pas concerné.
on:
  push:
    branches: [android-capture-prototype]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-prototype.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: write

# Une seule construction en cours par branche : éviter d'épuiser les
# machines GitHub en démarrant dix émulateurs pour dix petites corrections.
concurrency:
  group: terranova-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Lire le code
        uses: actions/checkout@v4
        with:
          # Construire toujours TerraNova, jamais l'ancienne PWA de main.
          ref: android-capture-prototype

      - name: Supprimer le journal ancien contenant un mot de passe divulgué
        # Un précédent build a affiché par erreur un mot de passe décodé.
        # Ce job tente de purger ce journal pour éviter l'accès public.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/38317497455" || {
            echo "::warning::Nettoyage journal 38317497455 à terminer manuellement."
          }

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tester l'extraction HTML et JSON-LD
        run: node android-app/tests/ExtractorSmokeTest.cjs

      - name: Tester les lots AFEDIM sur les quatre communes officielles
        run: node android-app/tests/AFEDIMSmokeTest.cjs

      - name: Vérifier les 18 lotisseurs intégrés
        run: node android-app/tests/LotisseursSmokeTest.cjs

      - name: Valider la nouvelle interface luxe et la recherche automatique
        run: node android-app/tests/TerraNovaUiSmokeTest.cjs

      - name: Tester le tri et les doublons sans Android
        run: |
          mkdir -p android-app/build/engine-smoke
          javac -encoding UTF-8 -d android-app/build/engine-smoke \
            android-app/app/src/main/java/fr/terrainscope/app/ListingEngine.java \
            android-app/app/src/main/java/fr/terrainscope/app/SourceListings.java \
            android-app/app/src/main/java/fr/terrainscope/app/DeveloperListings.java \
            android-app/app/src/main/java/fr/terrainscope/app/SearchUrls.java \
            android-app/tests/ListingEngineSmokeTest.java \
            android-app/tests/SourceListingsSmokeTest.java \
            android-app/tests/DeveloperListingsSmokeTest.java \
            android-app/tests/SearchUrlsSmokeTest.java
          java -cp android-app/build/engine-smoke fr.terrainscope.app.ListingEngineSmokeTest
          java -cp android-app/build/engine-smoke fr.terrainscope.app.SourceListingsSmokeTest
          java -cp android-app/build/engine-smoke fr.terrainscope.app.DeveloperListingsSmokeTest
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('android-app/app/src/main/assets/communes-37.json','utf8'));fs.writeFileSync('android-app/build/communes-37-test.tsv',a.map(x=>[x.nom,x.codesPostaux[0]].join(String.fromCharCode(9))).join(String.fromCharCode(10)));console.log('Communes testées :',a.length)"
          java -cp android-app/build/engine-smoke fr.terrainscope.app.SearchUrlsSmokeTest android-app/build/communes-37-test.tsv

      - name: Installer Android API 35
        run: |
          # Ubuntu GitHub dispose déjà du SDK Android. L'ancien setup-android
          # tente d'installer le paquet obsolète "tools", qui fait échouer le job.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Ne pas enregistrer de clé privée de signature dans le dépôt public.
      # Les secrets sont ajoutés une seule fois dans GitHub Settings > Secrets.
      - name: Préparer la clé permanente TerraNova si elle est configurée
        env:
          SIGNING_BUNDLE: ${{ secrets.TERRANOVA_SIGNING_BUNDLE }}
          KEYSTORE_B64: ${{ secrets.TERRANOVA_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TERRANOVA_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TERRANOVA_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TERRANOVA_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_BUNDLE" ]; then
            python3 - <<'PY'
          import base64, json, os, pathlib
          raw = base64.b64decode(os.environ["SIGNING_BUNDLE"])
          key = json.loads(raw)
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "terranova-signing.p12"
          path.write_bytes(base64.b64decode(key["keystore"]))
          path.chmod(0o600)
          # Le secret GitHub est masqué, mais ses mots de passe DÉCODÉS ne
          # le sont pas par défaut. Les masquer AVANT d'écrire GITHUB_ENV.
          for password_field in ("storePassword", "keyPassword"):
              print("::add-mask::" + key[password_field], flush=True)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write("TERRANOVA_SIGNING_KEYSTORE=" + str(path) + "\n")
              out.write("TERRANOVA_SIGNING_STORE_PASSWORD=" + key["storePassword"] + "\n")
              out.write("TERRANOVA_SIGNING_KEY_ALIAS=" + key["keyAlias"] + "\n")
              out.write("TERRANOVA_SIGNING_KEY_PASSWORD=" + key["keyPassword"] + "\n")
          PY
            echo "Signature permanente TerraNova activée, secret unique."
          elif [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "::add-mask::$SIGNING_STORE_PASSWORD"
            echo "::add-mask::$SIGNING_KEY_PASSWORD"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terranova-signing.jks"
            chmod 600 "$RUNNER_TEMP/terranova-signing.jks"
            echo "TERRANOVA_SIGNING_KEYSTORE=$RUNNER_TEMP/terranova-signing.jks" >> "$GITHUB_ENV"
            echo "TERRANOVA_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TERRANOVA_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TERRANOVA_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signature TerraNova stable activée (4 secrets existants)."
          else
            echo "::error::Signature permanente absente. Aucun APK temporaire ne doit être distribué : configurer TERRANOVA_SIGNING_BUNDLE avant de lancer le build."
            exit 1
          fi

      - name: Compiler la version Android non signée
        run: gradle -p android-app :app:assembleRelease --no-daemon

      - name: Signer l'APK avec la clé GitHub et vérifier le certificat
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$ZIPALIGN" && test -x "$AAPT"
          UNSIGNED="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          mkdir -p android-app/app/build/outputs/apk/terranova
          ALIGNED="$RUNNER_TEMP/terranova-aligned.apk"
          SIGNED="android-app/app/build/outputs/apk/terranova/TerraNova.apk"
          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"
          # Ne JAMAIS passer les mots de passe directement en arguments.
          # env:NOM récupère la valeur protégée dans l'environnement GitHub.
          "$APKSIGNER" sign --ks "$TERRANOVA_SIGNING_KEYSTORE" \
            --ks-type PKCS12 --ks-key-alias "$TERRANOVA_SIGNING_KEY_ALIAS" \
            --ks-pass env:TERRANOVA_SIGNING_STORE_PASSWORD \
            --key-pass env:TERRANOVA_SIGNING_KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          # apksigner est la référence Android pour vérifier une signature
          # (intégrité, schémas de signature et certificat). Le PKCS12 fourni
          # par le secret GitHub a été utilisé explicitement à la ligne sign.
          # Ne PAS reparser une empreinte avec sed/grep/aapt : leur sortie
          # dépend des versions et les tentatives précédentes rejetaient
          # des APK déjà signés alors que la vérification avait réussi.
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee "$RUNNER_TEMP/terranova-apk-verification.txt"
          test -s "$SIGNED"
          echo "APK signé par le PKCS12 GitHub et validé cryptographiquement par apksigner."
      - name: Publier une adresse de téléchargement stable
        # La même URL téléchargera toujours le dernier APK TerraNova signé.
        # La clé privée ne quitte jamais les secrets Actions.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/terranova/TerraNova.apk"
          test -s "$APK"
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-app/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android-app/app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" && test -n "$VERSION_CODE"
          cp "$APK" "$RUNNER_TEMP/TerraNova.apk"
          TAG="terranova-android-latest"
          RELEASE_NOTES="TerraNova Android $VERSION. Version Android : $VERSION_CODE. APK signé avec la clé permanente GitHub. Android demandera la confirmation d'installation."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/TerraNova.apk" --clobber
            gh release edit "$TAG" --title "TerraNova Android $VERSION" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG" "$RUNNER_TEMP/TerraNova.apk" --title "TerraNova Android $VERSION" --notes "$RELEASE_NOTES" --target android-capture-prototype --latest
          fi
          echo "APK public prêt : https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/TerraNova.apk"

      - name: Vérifier le démarrage sur un émulateur Android
        # Le runner Android GitHub peut planter (adb Broken pipe) avant même
        # d'installer l'APK : ne pas cacher cette limite, ni bloquer l'APK
        # quand tests + compilation sont passés. Contrôle visuel distinct.
        continue-on-error: true
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          ram-size: 1536M
          heap-size: 256M
          cores: 2
          disable-animations: true
          script: |
            adb install -r android-app/app/build/outputs/apk/terranova/TerraNova.apk
            adb shell am start -n fr.terranova.app/fr.terrainscope.app.MainActivity
            sleep 8
            # uiautomator dump lance un second processus Android : l'émulateur
            # du runner s'est fait tuer (code 137 / mémoire). Test plus léger.
            adb shell pidof fr.terranova.app | grep -Eq '[0-9]'
            # Vérifier que la rotation conserve LE MÊME processus Android :
            # sinon la recherche et les annonces pourraient être perdues.
            BEFORE_PID="$(adb shell pidof fr.terranova.app | tr -d '\r')"
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 3
            AFTER_PID="$(adb shell pidof fr.terranova.app | tr -d '\r')"
            test -n "$AFTER_PID" && test "$BEFORE_PID" = "$AFTER_PID"
            adb shell settings put system user_rotation 0
            sleep 2
            FINAL_PID="$(adb shell pidof fr.terranova.app | tr -d '\r')"
            test "$BEFORE_PID" = "$FINAL_PID"
            echo "Rotation aller-retour validée : processus TerraNova conservé."
            mkdir -p android-app/build/visual-test
            timeout 35 adb exec-out screencap -p > android-app/build/visual-test/accueil.png || true
            test -s android-app/build/visual-test/accueil.png
            python3 android-app/tests/VerifyScreenshot.py android-app/build/visual-test/accueil.png
            adb shell pidof fr.terranova.app | grep -Eq '[0-9]'

      - name: Conserver la capture de l'interface Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TerraNova-Android-Visual-Test
          path: android-app/build/visual-test/
          retention-days: 7
          if-no-files-found: warn

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: TerraNova-Android-Prototype-APK
          path: android-app/app/build/outputs/apk/terranova/TerraNova.apk
          retention-days: 7
          if-no-files-found: error
