name: Tester et construire TerraNova Android

# Notifications par e-mail évitées : aucun test automatique à chaque commit.
# Lancer le contrôle uniquement à la demande.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Une seule construction en cours par branche : éviter d'épuiser les
# machines GitHub en démarrant dix émulateurs pour dix petites corrections.
concurrency:
  group: terranova-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Lire le code
        uses: actions/checkout@v4
        with:
          # Construire toujours TerraNova, jamais l'ancienne PWA de main.
          ref: android-capture-prototype

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tester l'extraction HTML et JSON-LD
        run: node android-app/tests/ExtractorSmokeTest.cjs

      - name: Vérifier les 18 lotisseurs intégrés
        run: node android-app/tests/LotisseursSmokeTest.cjs

      - name: Valider la nouvelle interface luxe et la recherche automatique
        run: node android-app/tests/TerraNovaUiSmokeTest.cjs

      - name: Tester le tri et les doublons sans Android
        run: |
          mkdir -p android-app/build/engine-smoke
          javac -encoding UTF-8 -d android-app/build/engine-smoke \
            android-app/app/src/main/java/fr/terrainscope/app/ListingEngine.java \
            android-app/app/src/main/java/fr/terrainscope/app/SourceListings.java \
            android-app/app/src/main/java/fr/terrainscope/app/SearchUrls.java \
            android-app/tests/ListingEngineSmokeTest.java \
            android-app/tests/SourceListingsSmokeTest.java \
            android-app/tests/SearchUrlsSmokeTest.java
          java -cp android-app/build/engine-smoke fr.terrainscope.app.ListingEngineSmokeTest
          java -cp android-app/build/engine-smoke fr.terrainscope.app.SourceListingsSmokeTest
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('android-app/app/src/main/assets/communes-37.json','utf8'));fs.writeFileSync('android-app/build/communes-37-test.tsv',a.map(x=>[x.nom,x.codesPostaux[0]].join(String.fromCharCode(9))).join(String.fromCharCode(10)));console.log('Communes testées :',a.length)"
          java -cp android-app/build/engine-smoke fr.terrainscope.app.SearchUrlsSmokeTest android-app/build/communes-37-test.tsv

      - name: Installer Android API 35
        run: |
          # Ubuntu GitHub dispose déjà du SDK Android. L'ancien setup-android
          # tente d'installer le paquet obsolète "tools", qui fait échouer le job.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Ne pas enregistrer de clé privée de signature dans le dépôt public.
      # Les secrets sont ajoutés une seule fois dans GitHub Settings > Secrets.
      - name: Préparer la clé permanente TerraNova si elle est configurée
        env:
          SIGNING_BUNDLE: ${{ secrets.TERRANOVA_SIGNING_BUNDLE }}
          KEYSTORE_B64: ${{ secrets.TERRANOVA_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TERRANOVA_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TERRANOVA_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TERRANOVA_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_BUNDLE" ]; then
            python3 - <<'PY'
          import base64, json, os, pathlib
          raw = base64.b64decode(os.environ["SIGNING_BUNDLE"])
          key = json.loads(raw)
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "terranova-signing.p12"
          path.write_bytes(base64.b64decode(key["keystore"]))
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write("TERRANOVA_SIGNING_KEYSTORE=" + str(path) + "\n")
              out.write("TERRANOVA_SIGNING_STORE_PASSWORD=" + key["storePassword"] + "\n")
              out.write("TERRANOVA_SIGNING_KEY_ALIAS=" + key["keyAlias"] + "\n")
              out.write("TERRANOVA_SIGNING_KEY_PASSWORD=" + key["keyPassword"] + "\n")
          PY
            echo "Signature permanente TerraNova activée, secret unique."
          elif [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terranova-signing.jks"
            echo "TERRANOVA_SIGNING_KEYSTORE=$RUNNER_TEMP/terranova-signing.jks" >> "$GITHUB_ENV"
            echo "TERRANOVA_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TERRANOVA_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TERRANOVA_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signature TerraNova stable activée (4 secrets existants)."
          else
            echo "::error::Signature permanente absente. Aucun APK temporaire ne doit être distribué : configurer TERRANOVA_SIGNING_BUNDLE avant de lancer le build."
            exit 1
          fi

      - name: Construire l'application expérimentale
        run: gradle -p android-app :app:assembleDebug --no-daemon

      - name: Vérifier la signature et le certificat permanents
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/terranova-apk-verification.txt"
          # L'archive conservée par l'utilisateur peut être différente d'une
          # première clé préparée : comparer à LA CLÉ effectivement installée
          # dans GitHub plutôt qu'à une empreinte issue d'une autre archive.
          # On ne publie jamais la clé privée ni ses mots de passe.
          APK_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/terranova-apk-verification.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          KEY_SHA256="$(keytool -list -v -keystore "$TERRANOVA_SIGNING_KEYSTORE" -storepass "$TERRANOVA_SIGNING_STORE_PASSWORD" -alias "$TERRANOVA_SIGNING_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_SHA256" && test -n "$KEY_SHA256"
          test "$APK_SHA256" = "$KEY_SHA256" || {
            echo "::error::Le certificat de l'APK ne correspond pas à celui du secret GitHub."
            exit 1
          }
          echo "Signature APK valide et identique à la clé GitHub. Empreinte publique SHA-256 : $APK_SHA256"

      - name: Vérifier le démarrage sur un émulateur Android
        # Le runner Android GitHub peut planter (adb Broken pipe) avant même
        # d'installer l'APK : ne pas cacher cette limite, ni bloquer l'APK
        # quand tests + compilation sont passés. Contrôle visuel distinct.
        continue-on-error: true
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          ram-size: 1536M
          heap-size: 256M
          cores: 2
          disable-animations: true
          script: |
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n fr.terranova.app/fr.terrainscope.app.MainActivity
            sleep 8
            # uiautomator dump lance un second processus Android : l'émulateur
            # du runner s'est fait tuer (code 137 / mémoire). Test plus léger.
            adb shell pidof fr.terranova.app | grep -Eq '[0-9]'
            mkdir -p android-app/build/visual-test
            timeout 35 adb exec-out screencap -p > android-app/build/visual-test/accueil.png || true
            test -s android-app/build/visual-test/accueil.png
            python3 android-app/tests/VerifyScreenshot.py android-app/build/visual-test/accueil.png
            adb shell pidof fr.terranova.app | grep -Eq '[0-9]'

      - name: Conserver la capture de l'interface Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TerraNova-Android-Visual-Test
          path: android-app/build/visual-test/
          retention-days: 7
          if-no-files-found: warn

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: TerraNova-Android-Prototype-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
